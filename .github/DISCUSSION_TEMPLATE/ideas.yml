title: "[Idea] "
body:
  - type: markdown
    attributes:
      value: |
        Cuenta la idea por el **problema** que resuelve: eso ayuda más que la
        función concreta. Aquí se puede debatir sin compromiso.

  - type: textarea
    id: idea
    attributes:
      label: Tu idea
    validations:
      required: true

  - type: textarea
    id: problema
    attributes:
      label: ¿Qué problema resuelve?
      placeholder: "Hoy tengo que hacer X a mano y me lleva media hora…"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Área
      options:
        - Interfaz y usabilidad
        - Búsqueda y nuevas plataformas
        - Filtros y legalidad
        - Calidad y mejora de imagen
        - Datasets para IA
        - Organización y metadatos
        - Documentación y ayuda
        - Otra
    validations:
      required: true
