title: "[Dataset] "
body:
  - type: markdown
    attributes:
      value: |
        Espacio para **preparar imágenes y entrenar modelos**: LoRA, LyCORIS
        (LoCon, LoHa), embeddings, checkpoints / DreamBooth.

        Cuéntanos tu caso: cuántas imágenes, con qué etiquetas, si usas
        metadatos `.json` y cómo montas las captions.

  - type: textarea
    id: objetivo
    attributes:
      label: ¿Qué quieres entrenar?
      placeholder: "Un LoRA de estilo, un personaje, un LyCORIS…"
    validations:
      required: true

  - type: textarea
    id: como
    attributes:
      label: Cómo lo estás preparando
      description: Plataforma y etiquetas usadas, casillas marcadas (Mejorar calidad, Modo IA, metadatos .json) y tamaño objetivo.
    validations:
      required: false

  - type: dropdown
    id: tema
    attributes:
      label: ¿Qué necesitas?
      options:
        - Ayuda para elegir las imágenes
        - Duda con el tamaño o el reescalado
        - Etiquetas / captions
        - Compartir mi flujo de trabajo
        - Otro
    validations:
      required: true
