title: "[Soporte] "
body:
  - type: markdown
    attributes:
      value: |
        Cuéntanos qué te pasa y te ayudamos. Para ir al grano:

        1. Mira **[Problemas frecuentes](https://github.com/rgomezs2000/extractorfanarts/wiki/Problemas-frecuentes)**.
        2. Incluye **versión** (Ayuda → Acerca de) y **sistema**.
        3. Si puedes, adjunta **`selftest.txt`** (`Imaginteca.exe --selftest`) y las
           líneas del **registro del día** (`~/.imaginteca/logs`).

        > 🔐 Quita tus claves de lo que compartas.

  - type: textarea
    id: problema
    attributes:
      label: ¿Qué te ocurre?
      placeholder: "Al descargar de Gelbooru se queda en 0 resultados…"
    validations:
      required: true

  - type: input
    id: version-sistema
    attributes:
      label: Versión y sistema
      placeholder: "0.1.0-beta.2 · Windows 11"
    validations:
      required: true

  - type: textarea
    id: probado
    attributes:
      label: Qué has probado ya
      placeholder: "Con otra plataforma sí funciona; sin Modo IA también…"
    validations:
      required: false

  - type: textarea
    id: registro
    attributes:
      label: Registro o informe (opcional)
    validations:
      required: false
