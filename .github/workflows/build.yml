name: Compilar y publicar release (Windows, macOS, Linux)

# Dos formas de usarlo:
#   1) Manual:  Actions → "Run workflow"  → sube los paquetes como artefactos.
#   2) Release: sube una etiqueta v*  → compila los 3 sistemas y crea el Release
#      con los .zip adjuntos y las notas generadas automáticamente.
#
#   git tag v0.1.0
#   git push origin v0.1.0

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.nombre }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nombre: Windows (.exe)
            artefacto: Imaginteca-Windows
          - os: macos-latest
            nombre: macOS
            artefacto: Imaginteca-macOS
          - os: ubuntu-latest
            nombre: Linux
            artefacto: Imaginteca-Linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 httpx Pillow curl_cffi pyinstaller

      - name: Bibliotecas gráficas de Qt (solo Linux; sin ellas Qt no carga en el CI)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libegl1 libxkbcommon0 \
            libdbus-1-3 libfontconfig1 libxcb-cursor0 libxcb-xinerama0

      - name: Motores de IA (Real-ESRGAN / waifu2x) — opcional
        continue-on-error: true
        env:
          # La API de GitHub limita por IP sin autenticar y los runners la comparten:
          # sin token, la lista de releases falla y los motores no se descargan.
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/setup_vendor.py vendor --solo-ia

      # Informativa: el resultado queda en el registro, pero una limitación del
      # entorno del CI (sin pantalla, sin GPU, sin fuentes) no debe impedir publicar.
      - name: Autocomprobación antes de empaquetar
        continue-on-error: true
        run: python main.py --selftest

      # La marca hace que el paquete publicado se reconozca como PRODUCCIÓN (y active
      # las actualizaciones). Se escribe ANTES de compilar para que viaje dentro del
      # ejecutable; las copias hechas a mano en un equipo no la llevan y quedan como
      # DESARROLLO (sin actualizaciones).
      - name: Marcar el paquete como producción
        run: python scripts/marcar_release.py --version "$(python -c "from app import config; print(config.APP_VERSION)")" --etiqueta "${{ github.ref_name }}"

      - name: Compilar
        run: python scripts/build_exe.py

      # El asistente de Pixiv viaja DENTRO del paquete, junto a la aplicación: quien
      # descarga el release no tiene Python y necesita una forma de obtener su token.
      - name: Compilar el asistente de token de Pixiv
        run: python scripts/build_token_exe.py

      # El contexto `secrets` NO se admite dentro de un `if:`: si se usa ahí, GitHub
      # marca el flujo entero como inválido y no arranca ningún trabajo. Se pasa por
      # `env` (que sí lo admite) y el script decide si hay certificado o no.
      #
      # Sin certificado NO se firma nada y el aviso azul de SmartScreen sigue
      # apareciendo: eso solo lo quita un certificado de una autoridad (o Microsoft
      # Trusted Signing). Un certificado autofirmado NO sirve para eso.
      - name: Firmar los ejecutables (opcional; solo si hay certificado)
        if: ${{ matrix.os == 'windows-latest' }}
        continue-on-error: true
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          WINDOWS_CERT_THUMBPRINT: ${{ secrets.WINDOWS_CERT_THUMBPRINT }}
          TRUSTED_SIGNING_DLIB: ${{ secrets.TRUSTED_SIGNING_DLIB }}
          TRUSTED_SIGNING_METADATA: ${{ secrets.TRUSTED_SIGNING_METADATA }}
        run: pwsh -File scripts/firmar_windows.ps1 dist\Imaginteca\Imaginteca.exe dist\Imaginteca\pixiv-token.exe

      - name: Añadir licencia, avisos, LEEME y README de usuario al paquete
        shell: bash
        run: |
          cp LICENSE dist/Imaginteca/ 2>/dev/null || true
          cp THIRD-PARTY-NOTICES.txt dist/Imaginteca/ 2>/dev/null || true
          cp LEEME-PRIMERO.txt dist/Imaginteca/ 2>/dev/null || true
          # La guía del usuario viaja como README.md; el README técnico se queda en el repo
          cp README-USUARIO.md dist/Imaginteca/README.md 2>/dev/null || true
          # La marca de producción también junto al programa (y dentro del .app de macOS)
          python scripts/marcar_release.py --version "$(python -c "from app import config; print(config.APP_VERSION)")" --etiqueta "${{ github.ref_name }}"

      # ── Versión portátil también en .tar.gz (además del .zip del release) ───────
      - name: Versión portátil en .tar.gz
        shell: bash
        run: |
          cd dist
          tar -czf "${{ matrix.artefacto }}.tar.gz" Imaginteca
          ls -lh *.tar.gz

      # ── Instaladores por sistema ────────────────────────────────────────────────
      - name: Instalador de Windows (Inno Setup, con asistente)
        if: runner.os == 'Windows'
        run: python scripts/instaladores/crear_instalador_windows.py --dist dist/Imaginteca --salida dist/instaladores

      # El instalador también se firma (si hay certificado): es el archivo que la
      # gente ejecuta al descargarlo, así que es el que dispara el aviso de SmartScreen.
      - name: Firmar el instalador de Windows (opcional; solo si hay certificado)
        if: ${{ matrix.os == 'windows-latest' }}
        continue-on-error: true
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          WINDOWS_CERT_THUMBPRINT: ${{ secrets.WINDOWS_CERT_THUMBPRINT }}
          TRUSTED_SIGNING_DLIB: ${{ secrets.TRUSTED_SIGNING_DLIB }}
          TRUSTED_SIGNING_METADATA: ${{ secrets.TRUSTED_SIGNING_METADATA }}
        run: |
          $instaladores = Get-ChildItem dist\instaladores\*.exe -ErrorAction SilentlyContinue
          if (-not $instaladores) { Write-Host "No hay instalador que firmar"; exit 0 }
          pwsh -File scripts/firmar_windows.ps1 @($instaladores.FullName)

      - name: Instalador de macOS (.dmg)
        if: runner.os == 'macOS'
        run: |
          sh scripts/instaladores/crear_instalador_macos.sh \
             "$(python -c "from app import config; print(config.APP_VERSION)")" \
             dist/Imaginteca dist/instaladores

      - name: Instalador de Linux (.deb)
        if: runner.os == 'Linux'
        run: |
          sh scripts/instaladores/crear_instalador_linux.sh \
             "$(python -c "from app import config; print(config.APP_VERSION)")" \
             dist/Imaginteca dist/instaladores

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artefacto }}
          path: |
            dist/Imaginteca
            dist/*.tar.gz
            dist/instaladores
          if-no-files-found: error
          retention-days: 5

  release:
    name: Publicar release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      # El checkout es IMPRESCINDIBLE aquí: sin él, este job no tiene el repositorio
      # en el workspace y `python scripts/limpiar_release.py` no existe (el intérprete
      # termina con código 2). Fue la causa de que la limpieza del Release fallara
      # siempre en silencio y se acumularan adjuntos de versiones anteriores.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: paquetes

      - name: Empaquetar la versión portátil de cada sistema en .zip
        run: |
          cd paquetes
          for d in */; do
            nombre="${d%/}"
            # -y conserva los enlaces simbólicos (imprescindible en el .app de macOS).
            # Solo la carpeta de la aplicación: los instaladores y el .tar.gz van aparte.
            (cd "$nombre" && zip -qry "../${nombre}.zip" Imaginteca)
          done
          # El .tar.gz portátil y el instalador de cada sistema salen a la raíz
          # (solo los instaladores: el .iss con el que se generan no se publica)
          mv */*.tar.gz . 2>/dev/null || true
          mv */instaladores/*.exe */instaladores/*.dmg */instaladores/*.deb . 2>/dev/null || true
          ls -lh

      - name: Generar huellas SHA-256 (para verificar la descarga)
        run: |
          cd paquetes
          for f in *.zip *.tar.gz *.exe *.dmg *.deb; do
            [ -f "$f" ] || continue
            sha256sum "$f" > "$f.sha256"
            cat "$f.sha256"
          done

      - name: Crear el Release con los paquetes adjuntos
        uses: softprops/action-gh-release@v3
        with:
          # GitHub añade SIEMPRE dos enlaces «Source code (zip/tar.gz)» que no se pueden
          # desactivar (son una instantánea del tag, no adjuntos nuestros). Se aclara en
          # las notas para que nadie crea que forman parte de la publicación.
          body: |
            > **Sobre el código fuente.** Los archivos «Source code (zip)» y «Source code
            > (tar.gz)» que GitHub añade automáticamente a esta página son una instantánea
            > del repositorio y **no forman parte de esta publicación**: aquí se publican
            > los programas ya compilados (versión portátil e instaladores) y su
            > documentación.
            >
            > **Imaginteca es un programa propietario:** © 2026 InfoArte · Todos los derechos
            > reservados. La licencia **no permite redistribuir ni reutilizar el código**.
            > El código vive en el repositorio, con su licencia, y no se distribuye con el
            > programa.
          files: |
            paquetes/*.zip
            paquetes/*.tar.gz
            paquetes/*.exe
            paquetes/*.dmg
            paquetes/*.deb
            paquetes/*.sha256
          generate_release_notes: true
          draft: false
          # Desde v0.1.5-beta.5 (la beta DEFINITIVA) los releases se publican como
          # OFICIALES, no como pre-release: la versión sigue llamándose «beta», pero
          # el release es el oficial y GitHub lo marca como «Latest». Las betas
          # anteriores (v0.1.0-beta.1 … v0.1.5-beta.5) quedaron como pre-release.
          prerelease: false
          # Si quedara algún adjunto con el mismo nombre, se reemplaza.
          overwrite_files: true
          fail_on_unmatched_files: true

      # Limpieza DESPUÉS de publicar, nunca antes: si se borrara el Release primero y
      # algo fallara, la etiqueta se quedaría sin publicar. Aquí solo se retiran los
      # adjuntos que NO son de esta versión (restos de nombres antiguos o de otra
      # publicación), así que el Release siempre queda servible.
      - name: Retirar los adjuntos que no son de esta versión
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/limpiar_release.py --carpeta paquetes

      # Guardia: el Release debe quedar EXACTAMENTE con los adjuntos de esta versión
      # (portátil .zip y .tar.gz, instalador y .sha256 de cada sistema). Si sobra
      # alguno (resto de un nombre antiguo, de otra versión…), el trabajo falla y se
      # ve en el registro en vez de dejar el Release sucio.
      - name: Comprobar que el Release tiene exactamente los adjuntos esperados
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Solo lo que se publica: portátil (.zip y .tar.gz), instalador y huellas.
          esperados=$(find paquetes -maxdepth 1 -type f \
            \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.exe' \
               -o -name '*.dmg' -o -name '*.deb' -o -name '*.sha256' \) | wc -l)
          echo "Adjuntos esperados: $esperados"
          python scripts/limpiar_release.py --comprobar "$esperados"
