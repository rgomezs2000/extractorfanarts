name: Compilar y publicar release (Windows, macOS, Linux)

# Dos formas de usarlo:
#   1) Manual:  Actions → "Run workflow"  → sube los paquetes como artefactos.
#   2) Release: sube una etiqueta v*  → compila los 3 sistemas y crea el Release
#      con los .zip adjuntos y las notas generadas automáticamente.
#
#   git tag v0.1.0
#   git push origin v0.1.0

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.nombre }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nombre: Windows (.exe)
            artefacto: Imaginteca-Windows
          - os: macos-latest
            nombre: macOS
            artefacto: Imaginteca-macOS
          - os: ubuntu-latest
            nombre: Linux
            artefacto: Imaginteca-Linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 httpx Pillow curl_cffi pyinstaller

      - name: Bibliotecas gráficas de Qt (solo Linux; sin ellas Qt no carga en el CI)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libegl1 libxkbcommon0 \
            libdbus-1-3 libfontconfig1 libxcb-cursor0 libxcb-xinerama0

      - name: Motores de IA (Real-ESRGAN / waifu2x) — opcional
        continue-on-error: true
        env:
          # La API de GitHub limita por IP sin autenticar y los runners la comparten:
          # sin token, la lista de releases falla y los motores no se descargan.
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/setup_vendor.py vendor --solo-ia

      # Informativa: el resultado queda en el registro, pero una limitación del
      # entorno del CI (sin pantalla, sin GPU, sin fuentes) no debe impedir publicar.
      - name: Autocomprobación antes de empaquetar
        continue-on-error: true
        run: python main.py --selftest

      - name: Compilar
        run: python scripts/build_exe.py

      # El asistente de Pixiv viaja DENTRO del paquete, junto a la aplicación: quien
      # descarga el release no tiene Python y necesita una forma de obtener su token.
      - name: Compilar el asistente de token de Pixiv
        run: python scripts/build_token_exe.py

      # El contexto `secrets` NO se admite dentro de un `if:`: si se usa ahí, GitHub
      # marca el flujo entero como inválido y no arranca ningún trabajo. Se pasa por
      # `env` (que sí lo admite) y el propio script decide si hay certificado o no.
      - name: Firmar el ejecutable (opcional; solo si hay certificado)
        if: ${{ matrix.os == 'windows-latest' }}
        continue-on-error: true
        shell: pwsh
        env:
          CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:CERT_PFX_BASE64) {
            Write-Host "No hay certificado configurado (secret WINDOWS_CERT_PFX_BASE64): no se firma."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "certificado.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
                      Sort-Object FullName | Select-Object -Last 1
          if (-not $signtool) { Write-Host "::warning::no se encontró signtool"; exit 0 }
          & $signtool.FullName sign /f $pfx /p $env:CERT_PASSWORD `
              /fd sha256 /td sha256 /tr http://timestamp.digicert.com `
              "dist\Imaginteca\Imaginteca.exe"
          Remove-Item $pfx -Force

      - name: Añadir licencia, avisos, LEEME y README de usuario al paquete
        shell: bash
        run: |
          cp LICENSE dist/Imaginteca/ 2>/dev/null || true
          cp THIRD-PARTY-NOTICES.txt dist/Imaginteca/ 2>/dev/null || true
          cp LEEME-PRIMERO.txt dist/Imaginteca/ 2>/dev/null || true
          # La guía del usuario viaja como README.md; el README técnico se queda en el repo
          cp README-USUARIO.md dist/Imaginteca/README.md 2>/dev/null || true

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artefacto }}
          path: dist/
          if-no-files-found: error
          retention-days: 5

  release:
    name: Publicar release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      # Re-release limpio: se borran los adjuntos que ya tuviera el Release de esta
      # etiqueta (p. ej. de una publicación anterior de la MISMA versión, o con el
      # nombre antiguo del proyecto). Se hace con `gh api` porque es explícito y deja
      # su salida en el registro; `gh release delete` fallaba sin decir por qué.
      - name: Limpiar los adjuntos previos de esta etiqueta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Repositorio: $GITHUB_REPOSITORY · etiqueta: $GITHUB_REF_NAME"
          id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq .id 2>/dev/null || true)"
          if [ -z "$id" ]; then
            echo "No hay Release previo para esta etiqueta: nada que limpiar."
            exit 0
          fi
          echo "Release previo id=$id · adjuntos actuales:"
          gh api "repos/$GITHUB_REPOSITORY/releases/$id/assets" \
             --jq '.[] | "  \(.id)  \(.name)"' | tee /tmp/adjuntos.txt
          while read -r aid nombre; do
            [ -z "$aid" ] && continue
            echo "borrando adjunto obsoleto: $nombre"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$aid"
          done < /tmp/adjuntos.txt
          echo "Adjuntos que quedan:"
          gh api "repos/$GITHUB_REPOSITORY/releases/$id/assets" --jq '.[] | "  \(.name)"' || true

      - uses: actions/download-artifact@v4
        with:
          path: paquetes

      - name: Empaquetar cada sistema en un .zip
        run: |
          cd paquetes
          for d in */; do
            nombre="${d%/}"
            # -y conserva los enlaces simbólicos (imprescindible en el .app de macOS)
            (cd "$nombre" && zip -qry "../${nombre}.zip" .)
          done
          ls -lh *.zip

      - name: Generar huellas SHA-256 (para verificar la descarga)
        run: |
          cd paquetes
          for z in *.zip; do
            sha256sum "$z" > "$z.sha256"
            cat "$z.sha256"
          done

      - name: Crear el Release con los paquetes adjuntos
        uses: softprops/action-gh-release@v3
        with:
          files: |
            paquetes/*.zip
            paquetes/*.sha256
          generate_release_notes: true
          draft: false
          # Una etiqueta con sufijo (p. ej. v0.1.0-beta.1) se publica como
          # pre-release: queda marcada como beta y no sustituye a la estable.
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Si quedara algún adjunto con el mismo nombre, se reemplaza.
          overwrite_files: true
          fail_on_unmatched_files: true

      # Guardia: el Release debe quedar con EXACTAMENTE 6 adjuntos (3 .zip + 3 .sha256).
      # Si aparece cualquier otro (resto de un nombre antiguo, de otra versión…), el
      # trabajo falla y se ve en el registro en vez de dejar el Release sucio.
      - name: Comprobar que el Release no arrastra adjuntos viejos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
             --jq '.assets[].name' | sort | tee /tmp/finales.txt
          n="$(wc -l < /tmp/finales.txt)"
          echo "adjuntos en el Release: $n (se esperan 6)"
          if [ "$n" != "6" ]; then
            echo "::error::El Release de $GITHUB_REF_NAME tiene $n adjuntos; revisa la limpieza previa."
            exit 1
          fi
