name: Compilar y publicar release (Windows, macOS, Linux)

# Dos formas de usarlo:
#   1) Manual:  Actions → "Run workflow"  → sube los paquetes como artefactos.
#   2) Release: sube una etiqueta v*  → compila los 3 sistemas y crea el Release
#      con los .zip adjuntos y las notas generadas automáticamente.
#
#   git tag v0.1.0
#   git push origin v0.1.0

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.nombre }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nombre: Windows (.exe)
            artefacto: ExtractorFanarts-Windows
          - os: macos-latest
            nombre: macOS
            artefacto: ExtractorFanarts-macOS
          - os: ubuntu-latest
            nombre: Linux
            artefacto: ExtractorFanarts-Linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 httpx Pillow curl_cffi pyinstaller

      - name: Bibliotecas gráficas de Qt (solo Linux; sin ellas Qt no carga en el CI)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libegl1 libxkbcommon0 \
            libdbus-1-3 libfontconfig1 libxcb-cursor0 libxcb-xinerama0

      - name: Motores de IA (Real-ESRGAN / waifu2x) — opcional
        continue-on-error: true
        run: python scripts/setup_vendor.py vendor --solo-ia

      # Informativa: el resultado queda en el registro, pero una limitación del
      # entorno del CI (sin pantalla, sin GPU, sin fuentes) no debe impedir publicar.
      - name: Autocomprobación antes de empaquetar
        continue-on-error: true
        run: python main.py --selftest

      - name: Compilar
        run: python scripts/build_exe.py

      # El contexto `secrets` NO se admite dentro de un `if:`: si se usa ahí, GitHub
      # marca el flujo entero como inválido y no arranca ningún trabajo. Se pasa por
      # `env` (que sí lo admite) y el propio script decide si hay certificado o no.
      - name: Firmar el ejecutable (opcional; solo si hay certificado)
        if: ${{ matrix.os == 'windows-latest' }}
        continue-on-error: true
        shell: pwsh
        env:
          CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:CERT_PFX_BASE64) {
            Write-Host "No hay certificado configurado (secret WINDOWS_CERT_PFX_BASE64): no se firma."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "certificado.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
                      Sort-Object FullName | Select-Object -Last 1
          if (-not $signtool) { Write-Host "::warning::no se encontró signtool"; exit 0 }
          & $signtool.FullName sign /f $pfx /p $env:CERT_PASSWORD `
              /fd sha256 /td sha256 /tr http://timestamp.digicert.com `
              "dist\ExtractorFanarts\ExtractorFanarts.exe"
          Remove-Item $pfx -Force

      - name: Añadir licencia, avisos y LEEME al paquete
        shell: bash
        run: |
          cp LICENSE dist/ExtractorFanarts/ 2>/dev/null || true
          cp THIRD-PARTY-NOTICES.txt dist/ExtractorFanarts/ 2>/dev/null || true
          cp LEEME-PRIMERO.txt dist/ExtractorFanarts/ 2>/dev/null || true

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artefacto }}
          path: dist/
          if-no-files-found: error
          retention-days: 5

  release:
    name: Publicar release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: paquetes

      - name: Empaquetar cada sistema en un .zip
        run: |
          cd paquetes
          for d in */; do
            nombre="${d%/}"
            # -y conserva los enlaces simbólicos (imprescindible en el .app de macOS)
            (cd "$nombre" && zip -qry "../${nombre}.zip" .)
          done
          ls -lh *.zip

      - name: Generar huellas SHA-256 (para verificar la descarga)
        run: |
          cd paquetes
          for z in *.zip; do
            sha256sum "$z" > "$z.sha256"
            cat "$z.sha256"
          done

      - name: Crear el Release con los paquetes adjuntos
        uses: softprops/action-gh-release@v2
        with:
          files: |
            paquetes/*.zip
            paquetes/*.sha256
          generate_release_notes: true
          draft: false
          # Una etiqueta con sufijo (p. ej. v0.1.0-beta.1) se publica como
          # pre-release: queda marcada como beta y no sustituye a la estable.
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
