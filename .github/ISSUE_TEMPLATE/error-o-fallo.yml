name: 🐞 Error o fallo
description: Algo no funciona como debería (con pasos para reproducirlo)
title: "[Fallo] "
body:
  - type: markdown
    attributes:
      value: |
        ¡Gracias por reportarlo! Cuanto más concreto, antes se puede corregir.

        Antes de seguir, mira **[Problemas frecuentes](https://github.com/rgomezs2000/extractorfanarts/wiki/Problemas-frecuentes)**:
        la mayoría de los avisos ya están explicados.

        > 🔐 Quita de los archivos o capturas cualquier clave personal antes de publicarlos.

  - type: textarea
    id: que-pasa
    attributes:
      label: ¿Qué pasa?
      description: El mensaje exacto que ves, si lo hay.
      placeholder: "Al pulsar Descargar aparece «…»"
    validations:
      required: true

  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      description: Qué hiciste, en orden, para que vuelva a pasar.
      placeholder: |
        1. Tipo Booru → Danbooru
        2. Busco «1girl solo»
        3. Marco Mejorar calidad + Modo IA
        4. Pulsa Descargar → falla en la imagen 12
    validations:
      required: true

  - type: textarea
    id: esperado
    attributes:
      label: ¿Qué esperabas que pasara?
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Versión de Imaginteca
      description: La ves en Ayuda → Acerca de (o con `Imaginteca.exe --version`).
      placeholder: "0.1.0-beta.2"
    validations:
      required: true

  - type: dropdown
    id: sistema
    attributes:
      label: Sistema
      options:
        - Windows 11
        - Windows 10
        - Linux
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Otro (lo digo abajo)
    validations:
      required: true

  - type: dropdown
    id: plataforma
    attributes:
      label: ¿En qué plataforma pasa?
      options:
        - No es de una plataforma concreta
        - Booru (digo cuál abajo)
        - Red social (digo cuál abajo)
        - Wiki de fandom
        - Al guardar / convertir la imagen
        - Al mejorar la calidad (Lanczos o IA)
        - Al actualizar el programa
    validations:
      required: true

  - type: textarea
    id: adjuntos
    attributes:
      label: Informe y registro
      description: |
        Pega aquí el contenido de **selftest.txt** (`Imaginteca.exe --selftest`) y
        las líneas relevantes del **registro del día**
        (`%USERPROFILE%\.imaginteca\logs\app-AAAA-MM-DD.log`, o `~/.imaginteca/logs/...`).
        Puedes arrastrar los archivos aquí.
    validations:
      required: false

  - type: checkboxes
    id: comprobaciones
    attributes:
      label: Antes de enviar
      options:
        - label: He buscado si ya existe una incidencia igual.
          required: true
        - label: He quitado mis claves de lo que comparto.
          required: true
